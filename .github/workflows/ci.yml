name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run the same checks before publishing.
  workflow_call:
    inputs:
      docker:
        description: Also run the docker build check
        type: boolean
        default: true

permissions:
  contents: read

# nextduel-svr depends on the PRIVATE repo 8xNehanSS/NEX-Server-Framework
# (go.mod: replace nex-server => ../../nex-server). Jobs that need it check it
# out with a read-only deploy key stored in the NEX_SERVER_DEPLOY_KEY secret.
# Setup steps: README.md -> "CI".

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.NEX_SERVER_DEPLOY_KEY != '' }}
    defaults:
      run:
        working-directory: NextDuel/nextduel-svr
    steps:
      - name: require nex-server deploy key
        if: env.HAS_DEPLOY_KEY != 'true'
        working-directory: .
        run: |
          echo "::error title=Missing secret::NEX_SERVER_DEPLOY_KEY is not set (or not available to this run, e.g. a PR from a fork). See README.md -> CI."
          exit 1

      # Both repos are checked out side by side so ../../nex-server resolves.
      - uses: actions/checkout@v4
        with:
          path: NextDuel
      - uses: actions/checkout@v4
        with:
          repository: 8xNehanSS/NEX-Server-Framework
          ssh-key: ${{ secrets.NEX_SERVER_DEPLOY_KEY }}
          path: nex-server
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: NextDuel/nextduel-svr/go.mod
          cache-dependency-path: NextDuel/nextduel-svr/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextduel-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextduel-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    # Skipped when release.yml calls this workflow; it builds the image itself.
    if: inputs.docker != false
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          path: NextDuel
      - uses: actions/checkout@v4
        with:
          repository: 8xNehanSS/NEX-Server-Framework
          ssh-key: ${{ secrets.NEX_SERVER_DEPLOY_KEY }}
          path: nex-server
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NextDuel/Dockerfile
          push: false
          build-args: VERSION=${{ github.sha }}
