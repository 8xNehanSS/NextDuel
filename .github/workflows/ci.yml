name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NextDuel/nextduel-svr
    steps:
      # go.mod replaces nex-server => ../../nex-server, so both repos are
      # checked out side by side under the workspace.
      - uses: actions/checkout@v4
        with:
          path: NextDuel
      - uses: actions/checkout@v4
        with:
          repository: 8xNehanSS/NEX-Server-Framework
          path: nex-server

      - uses: actions/setup-go@v5
        with:
          go-version-file: NextDuel/nextduel-svr/go.mod
          cache-dependency-path: NextDuel/nextduel-svr/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextduel-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextduel-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          path: NextDuel
      - uses: actions/checkout@v4
        with:
          repository: 8xNehanSS/NEX-Server-Framework
          path: nex-server
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: NextDuel/Dockerfile
          push: false
          build-args: VERSION=${{ github.sha }}
